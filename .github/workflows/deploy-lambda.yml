name: Deploy Lambda scraper

on:
  push:
    branches: [main]
    paths:
      - 'lambda_function.py'
      - 'depto_monitor/**'
      - 'requirements.txt'
      - 'infra/**'
      - '.github/workflows/deploy-lambda.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-2' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Package Lambda
        run: |
          set -euo pipefail
          mkdir -p build/package
          python -m pip install --requirement requirements.txt --target build/package
          cp lambda_function.py build/package/
          cp -R depto_monitor build/package/
          (cd build/package && zip -qr ../depto-scraper-lambda.zip .)

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Bootstrap Terraform state
        id: bootstrap
        run: |
          set -euo pipefail
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          STATE_BUCKET="depto-scraper-terraform-state-${ACCOUNT_ID}"
          LOCK_TABLE="depto-scraper-terraform-locks"
          if ! aws s3api head-bucket --bucket "$STATE_BUCKET" 2>/dev/null; then
            if [ "$AWS_REGION" = "us-east-1" ]; then
              aws s3api create-bucket --bucket "$STATE_BUCKET"
            else
              aws s3api create-bucket --bucket "$STATE_BUCKET" --create-bucket-configuration LocationConstraint="$AWS_REGION"
            fi
            aws s3api put-bucket-versioning --bucket "$STATE_BUCKET" --versioning-configuration Status=Enabled
            aws s3api put-public-access-block --bucket "$STATE_BUCKET" --public-access-block-configuration BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true
          fi
          if ! aws dynamodb describe-table --table-name "$LOCK_TABLE" >/dev/null 2>&1; then
            aws dynamodb create-table --table-name "$LOCK_TABLE" --attribute-definitions AttributeName=LockID,AttributeType=S --key-schema AttributeName=LockID,KeyType=HASH --billing-mode PAY_PER_REQUEST
            aws dynamodb wait table-exists --table-name "$LOCK_TABLE"
          fi
          echo "bucket=$STATE_BUCKET" >> "$GITHUB_OUTPUT"
          echo "lock_table=$LOCK_TABLE" >> "$GITHUB_OUTPUT"

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.8'

      - name: Apply infrastructure
        working-directory: infra
        run: |
          set -euo pipefail
          terraform init -input=false -reconfigure \
            -backend-config="bucket=${{ steps.bootstrap.outputs.bucket }}" \
            -backend-config="key=production/terraform.tfstate" \
            -backend-config="region=$AWS_REGION" \
            -backend-config="dynamodb_table=${{ steps.bootstrap.outputs.lock_table }}" \
            -backend-config="encrypt=true"
          terraform fmt -check
          terraform validate
          terraform apply -input=false -auto-approve

      - name: Store Lambda runtime secrets
        working-directory: infra
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          WHATSAPP_SIDECAR_URL: ${{ secrets.WHATSAPP_SIDECAR_URL }}
          WAWEB_SHARED_SECRET: ${{ secrets.WAWEB_SHARED_SECRET }}
          DEFAULT_WHATSAPP_CHAT_ID: ${{ secrets.DEFAULT_WHATSAPP_CHAT_ID }}
          SCRAPER_LAMBDA_SHARED_SECRET: ${{ secrets.SCRAPER_LAMBDA_SHARED_SECRET }}
        run: |
          set -euo pipefail
          SECRET_ARN=$(terraform output -raw runtime_secret_arn)
          SECRET_JSON=$(jq -cn \
            --arg supabase_url "$SUPABASE_URL" \
            --arg supabase_service_role_key "$SUPABASE_SERVICE_ROLE_KEY" \
            --arg preview_shared_secret "$SCRAPER_LAMBDA_SHARED_SECRET" \
            --arg whatsapp_sidecar_url "$WHATSAPP_SIDECAR_URL" \
            --arg waweb_shared_secret "$WAWEB_SHARED_SECRET" \
            --arg default_whatsapp_chat_id "$DEFAULT_WHATSAPP_CHAT_ID" \
            '{supabase_url:$supabase_url,supabase_service_role_key:$supabase_service_role_key,preview_shared_secret:$preview_shared_secret,whatsapp_sidecar_url:$whatsapp_sidecar_url,waweb_shared_secret:$waweb_shared_secret,default_whatsapp_chat_id:$default_whatsapp_chat_id}')
          aws secretsmanager put-secret-value --secret-id "$SECRET_ARN" --secret-string "$SECRET_JSON" >/dev/null

      - name: Show integration values
        working-directory: infra
        run: |
          echo "Lambda URL: $(terraform output -raw lambda_function_url)"
          echo "CloudWatch log group: $(terraform output -raw cloudwatch_log_group)"
