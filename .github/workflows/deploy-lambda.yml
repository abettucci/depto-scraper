name: Deploy Lambda scraper

on:
  push:
    branches: [main]
    paths:
      - 'lambda_function.py'
      - 'depto_monitor/**'
      - 'requirements.txt'
      - 'infra/**'
      - '.github/workflows/deploy-lambda.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-lambda-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-2' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Package Lambda
        run: |
          set -euo pipefail
          mkdir -p build/package
          python -m pip install --requirement requirements.txt --target build/package
          cp lambda_function.py build/package/
          cp -R depto_monitor build/package/
          (cd build/package && zip -qr ../depto-scraper-lambda.zip .)

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Bootstrap Terraform state
        id: bootstrap
        run: |
          set -euo pipefail
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          STATE_BUCKET="depto-scraper-terraform-state-${ACCOUNT_ID}"
          if ! aws s3api head-bucket --bucket "$STATE_BUCKET" 2>/dev/null; then
            if [ "$AWS_REGION" = "us-east-1" ]; then
              aws s3api create-bucket --bucket "$STATE_BUCKET"
            else
              aws s3api create-bucket --bucket "$STATE_BUCKET" --create-bucket-configuration LocationConstraint="$AWS_REGION"
            fi
            aws s3api put-bucket-versioning --bucket "$STATE_BUCKET" --versioning-configuration Status=Enabled
            aws s3api put-public-access-block --bucket "$STATE_BUCKET" --public-access-block-configuration BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true
          fi
          echo "bucket=$STATE_BUCKET" >> "$GITHUB_OUTPUT"

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.8'

      - name: Apply infrastructure
        working-directory: infra
        run: |
          set -euo pipefail
          terraform init -input=false -reconfigure \
            -backend-config="bucket=${{ steps.bootstrap.outputs.bucket }}" \
            -backend-config="key=production/terraform.tfstate" \
            -backend-config="region=$AWS_REGION" \
            -backend-config="encrypt=true"
          import_if_missing() {
            local address="$1"
            local resource_id="$2"
            terraform state show "$address" >/dev/null 2>&1 || terraform import -input=false "$address" "$resource_id"
          }
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          ARTIFACT_BUCKET="depto-scraper-lambda-artifacts-${ACCOUNT_ID}"
          if aws s3api head-bucket --bucket "$ARTIFACT_BUCKET" 2>/dev/null; then
            import_if_missing aws_s3_bucket.artifacts "$ARTIFACT_BUCKET"
            import_if_missing aws_s3_bucket_public_access_block.artifacts "$ARTIFACT_BUCKET"
          fi
          if SECRET_ARN=$(aws secretsmanager describe-secret --secret-id depto-scraper/runtime --query ARN --output text 2>/dev/null); then
            import_if_missing aws_secretsmanager_secret.runtime "$SECRET_ARN"
          fi
          terraform fmt -check
          terraform validate
          terraform apply -input=false -auto-approve

      - name: Allow public Function URL invocation
        run: |
          set -euo pipefail
          aws lambda remove-permission --function-name depto-scraper --statement-id AllowFunctionUrlInvoke 2>/dev/null || true
          aws lambda add-permission --function-name depto-scraper --statement-id AllowFunctionUrlInvoke --action lambda:InvokeFunction --principal '*' --invoked-via-function-url >/dev/null

      - name: Store Lambda runtime secrets
        working-directory: infra
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          WHATSAPP_SIDECAR_URL: ${{ secrets.WHATSAPP_SIDECAR_URL }}
          WAWEB_SHARED_SECRET: ${{ secrets.WAWEB_SHARED_SECRET }}
          DEFAULT_WHATSAPP_CHAT_ID: ${{ secrets.DEFAULT_WHATSAPP_CHAT_ID }}
          SCRAPER_LAMBDA_SHARED_SECRET: ${{ secrets.SCRAPER_LAMBDA_SHARED_SECRET }}
          MELI_CLIENT_ID: ${{ secrets.MELI_CLIENT_ID }}
          MELI_CLIENT_SECRET: ${{ secrets.MELI_CLIENT_SECRET }}
          MELI_REFRESH_TOKEN: ${{ secrets.MELI_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          SECRET_ARN=$(terraform output -raw runtime_secret_arn)
          PREVIOUS_SECRET_JSON=$(aws secretsmanager get-secret-value --secret-id "$SECRET_ARN" --query SecretString --output text 2>/dev/null || printf '{}')
          PERSISTED_MELI_REFRESH_TOKEN=$(jq -r '.meli_refresh_token // empty' <<< "$PREVIOUS_SECRET_JSON")
          PERSISTED_MELI_ACCESS_TOKEN=$(jq -r '.meli_access_token // empty' <<< "$PREVIOUS_SECRET_JSON")
          PERSISTED_MELI_ACCESS_TOKEN_EXPIRES_AT=$(jq -r '.meli_access_token_expires_at // empty' <<< "$PREVIOUS_SECRET_JSON")
          MELI_RUNTIME_REFRESH_TOKEN="${PERSISTED_MELI_REFRESH_TOKEN:-$MELI_REFRESH_TOKEN}"
          SECRET_JSON=$(jq -cn \
            --arg supabase_url "$SUPABASE_URL" \
            --arg supabase_service_role_key "$SUPABASE_SERVICE_ROLE_KEY" \
            --arg preview_shared_secret "$SCRAPER_LAMBDA_SHARED_SECRET" \
            --arg whatsapp_sidecar_url "$WHATSAPP_SIDECAR_URL" \
            --arg waweb_shared_secret "$WAWEB_SHARED_SECRET" \
            --arg default_whatsapp_chat_id "$DEFAULT_WHATSAPP_CHAT_ID" \
            --arg meli_client_id "$MELI_CLIENT_ID" \
            --arg meli_client_secret "$MELI_CLIENT_SECRET" \
            --arg meli_refresh_token "$MELI_RUNTIME_REFRESH_TOKEN" \
            --arg meli_access_token "$PERSISTED_MELI_ACCESS_TOKEN" \
            --argjson meli_access_token_expires_at "${PERSISTED_MELI_ACCESS_TOKEN_EXPIRES_AT:-null}" \
            '{supabase_url:$supabase_url,supabase_service_role_key:$supabase_service_role_key,preview_shared_secret:$preview_shared_secret,whatsapp_sidecar_url:$whatsapp_sidecar_url,waweb_shared_secret:$waweb_shared_secret,default_whatsapp_chat_id:$default_whatsapp_chat_id,meli_client_id:$meli_client_id,meli_client_secret:$meli_client_secret,meli_refresh_token:$meli_refresh_token,meli_access_token:$meli_access_token,meli_access_token_expires_at:$meli_access_token_expires_at}')
          aws secretsmanager put-secret-value --secret-id "$SECRET_ARN" --secret-string "$SECRET_JSON" >/dev/null

      - name: Show integration values
        working-directory: infra
        run: |
          echo "Lambda URL: $(terraform output -raw lambda_function_url)"
          echo "CloudWatch log group: $(terraform output -raw cloudwatch_log_group)"
