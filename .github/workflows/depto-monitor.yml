name: Deptos monitor
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: read
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip }
      - run: python -m pip install --requirement requirements.txt
      - run: python -m depto_monitor.run
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          WHATSAPP_SIDECAR_URL: ${{ secrets.WHATSAPP_SIDECAR_URL }}
          WAWEB_SHARED_SECRET: ${{ secrets.WAWEB_SHARED_SECRET }}
          DEFAULT_WHATSAPP_CHAT_ID: ${{ secrets.DEFAULT_WHATSAPP_CHAT_ID }}
