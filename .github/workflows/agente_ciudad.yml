name: Agente Ciudad — Reporte Diario

on:
  schedule:
    - cron: "0 11 * * 1-5"   # 8am Argentina (UTC-3), lunes a viernes
  workflow_dispatch:           # permite correrlo manualmente desde GitHub

jobs:
  reporte:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r agente_ciudad/requirements.txt

      - name: Correr agente
        env:
          ASANA_TOKEN: ${{ secrets.ASANA_TOKEN }}
          SLACK_WEBHOOK_CIUDAD: ${{ secrets.SLACK_WEBHOOK_CIUDAD }}
        run: python agente_ciudad/agent_ciudad.py
