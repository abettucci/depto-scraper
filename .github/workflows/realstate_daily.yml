name: Real State Scraper Daily

on:
  schedule:
    # 8:00 AM Argentina (ART = UTC-3) → 11:00 AM UTC, Lun-Sab
    - cron: "0 11 * * 1-6"
  workflow_dispatch:  # permite correrlo a mano desde GitHub

permissions:
  contents: write

concurrency:
  group: miranda-scraper-history
  cancel-in-progress: false

jobs:
  scrape:
    # Runner configurable: por defecto GitHub-hosted. Para correr desde tu PC (IP residencial,
    # necesaria si Zonaprop bloquea las IPs de GitHub): registrar un self-hosted runner
    # (Settings → Actions → Runners → New self-hosted runner) y crear la variable de repo
    # RUNNER_LABEL = self-hosted (Settings → Secrets and variables → Actions → Variables).
    # Para volver a GitHub-hosted, borrar la variable.
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}

    defaults:
      run:
        working-directory: miranda_scraper
        shell: bash   # también en runners Windows (usa Git Bash)

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: miranda_scraper/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run scraper
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          PYTHONIOENCODING: utf-8
        run: python main.py

      - name: Commit updated history
        working-directory: ${{ github.workspace }}
        run: |
          echo "WORKFLOW VERSION: FIXED_NOREBASE_2026_05_05"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git

          HISTORY=miranda_scraper/data/history.xlsx

          # Si no cambió nada, salir
          if git diff --quiet HEAD -- "$HISTORY" && ! git ls-files --others --exclude-standard | grep -q "$HISTORY"; then
            echo "No history changes — skipping commit"
            exit 0
          fi

          # Guardar el xlsx generado por el scraper
          cp "$HISTORY" /tmp/history_new.xlsx

          # Hard reset al último estado de origin/main (evita conflictos de binarios)
          git fetch origin main
          git reset --hard origin/main

          # Restaurar el xlsx nuevo
          cp /tmp/history_new.xlsx "$HISTORY"

          git add "$HISTORY"

          if git diff --staged --quiet; then
            echo "No history changes after reset — skipping commit"
            exit 0
          fi

          git commit -m "chore: update history $(date +'%Y-%m-%d')"
          git push origin main
